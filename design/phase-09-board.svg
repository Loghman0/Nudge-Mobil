<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#edf2f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="57" font-size="18" fill="#355db9">NUDGE • PHASE 9</text><text x="48" y="118" font-size="38" fill="#253348">Known checks and open proof</text><text x="48" y="184" font-size="19" fill="#536479">Audit boundary · a source review is not a perfect-app certification</text><rect x="48" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="272" font-size="23" fill="#253348">Known from source and calculation</text><text x="76" y="321" font-size="21" fill="#536479">Shared native tokens, selected-state</text><text x="76" y="352" font-size="21" fill="#536479">primitives, separate topic Apply,</text><text x="76" y="383" font-size="21" fill="#536479">privacy-aware contracts and checked opaque</text><text x="76" y="414" font-size="21" fill="#536479">color pairs.</text><rect x="614" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="272" font-size="23" fill="#253348">Device checks still required</text><text x="642" y="321" font-size="21" fill="#536479">TalkBack, largest text,</text><text x="642" y="352" font-size="21" fill="#536479">small/landscape/tablet layout, touch gaps,</text><text x="642" y="383" font-size="21" fill="#536479">focus return and reduced-motion behavior.</text><rect x="48" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="526" font-size="23" fill="#253348">Three priority fixes</text><text x="76" y="575" font-size="21" fill="#536479">Complete real route parity. Validate failure</text><text x="76" y="606" font-size="21" fill="#536479">recovery in the latest APK. Test whether</text><text x="76" y="637" font-size="21" fill="#536479">people understand reflection evidence and</text><text x="76" y="668" font-size="21" fill="#536479">limits.</text><rect x="614" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="526" font-size="23" fill="#253348">Keep claims bounded</text><text x="642" y="575" font-size="21" fill="#536479">No invented participant findings, measured</text><text x="642" y="606" font-size="21" fill="#536479">speed, native push delivery or</text><text x="642" y="637" font-size="21" fill="#536479">public-release readiness.</text><text x="48" y="802" font-size="17" fill="#536479">Design specification • Proposals and verification boundaries • Not an app screenshot</text></g></svg>