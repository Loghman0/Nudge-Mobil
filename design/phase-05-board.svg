<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#edf2f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="57" font-size="18" fill="#355db9">NUDGE • PHASE 5</text><text x="48" y="118" font-size="38" fill="#253348">Three structures, one Nudge identity</text><text x="48" y="184" font-size="19" fill="#536479">Design proposals · Clear question selected under the owner's approval to proceed</text><rect x="48" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="272" font-size="23" fill="#253348">A · Clear question — selected</text><text x="76" y="321" font-size="21" fill="#536479">One prompt, generous answer rows, a small</text><text x="76" y="352" font-size="21" fill="#536479">evidence fold. Best fit for first use and</text><text x="76" y="383" font-size="21" fill="#536479">one-handed answering.</text><rect x="614" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="272" font-size="23" fill="#253348">B · Field notes</text><text x="642" y="321" font-size="21" fill="#536479">Chronological answers, reflections and</text><text x="642" y="352" font-size="21" fill="#536479">revisions. Strong audit trail; risks feeling</text><text x="642" y="383" font-size="21" fill="#536479">dense before Nudge knows enough.</text><rect x="48" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="526" font-size="23" fill="#253348">C · Connections</text><text x="76" y="575" font-size="21" fill="#536479">Pair an answer with the reflection and</text><text x="76" y="606" font-size="21" fill="#536479">decision context it supports. Strong</text><text x="76" y="637" font-size="21" fill="#536479">explanation; avoid an empty decorative</text><text x="76" y="668" font-size="21" fill="#536479">graph.</text><rect x="614" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="526" font-size="23" fill="#253348">Keep the mark and blue</text><text x="642" y="575" font-size="21" fill="#536479">Same Nudge logo and palette. Borrow revision</text><text x="642" y="606" font-size="21" fill="#536479">clarity and source links without</text><text x="642" y="637" font-size="21" fill="#536479">cream/terracotta, acid accents or generic</text><text x="642" y="668" font-size="21" fill="#536479">dashboards.</text><text x="48" y="802" font-size="17" fill="#536479">Design specification • Proposals and verification boundaries • Not an app screenshot</text></g></svg>