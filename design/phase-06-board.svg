<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#edf2f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="57" font-size="18" fill="#355db9">NUDGE • PHASE 6</text><text x="48" y="118" font-size="38" fill="#253348">A checked palette, meaningful controls</text><text x="48" y="184" font-size="19" fill="#536479">Calculated from current source colors · rendered accessibility still needs device checks</text><rect x="48" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="272" font-size="23" fill="#253348">Light and dark checked separately</text><text x="76" y="321" font-size="21" fill="#536479">Primary text: 11.33:1 light, 13.75:1 dark on</text><text x="76" y="352" font-size="21" fill="#536479">screen. Secondary text: 5.38:1 and 9.51:1.</text><rect x="614" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="272" font-size="23" fill="#253348">Reference → role → component</text><text x="642" y="321" font-size="21" fill="#536479">Keep the exact blue brand, document OKLCH</text><text x="642" y="352" font-size="21" fill="#536479">equivalents, and make components use</text><text x="642" y="383" font-size="21" fill="#536479">semantic tokens.</text><rect x="48" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="526" font-size="23" fill="#253348">Control boundaries matter</text><text x="76" y="575" font-size="21" fill="#536479">Faint separator colors are decorative.</text><text x="76" y="606" font-size="21" fill="#536479">Inputs use controlLine; selected answers add</text><text x="76" y="637" font-size="21" fill="#536479">a checkmark and announced state.</text><rect x="614" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="526" font-size="23" fill="#253348">Readable and reachable</text><text x="642" y="575" font-size="21" fill="#536479">16-unit base body size with system scaling,</text><text x="642" y="606" font-size="21" fill="#536479">48dp Android touch targets and at least 8dp</text><text x="642" y="637" font-size="21" fill="#536479">separation. No color-only status.</text><text x="48" y="802" font-size="17" fill="#536479">Design specification • Proposals and verification boundaries • Not an app screenshot</text></g></svg>