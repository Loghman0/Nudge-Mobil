<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#edf2f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="57" font-size="18" fill="#355db9">NUDGE • PHASE 8</text><text x="48" y="118" font-size="38" fill="#253348">Feedback that explains what changed</text><text x="48" y="184" font-size="19" fill="#536479">Motion targets · timing and frame rates are not yet measured</text><rect x="48" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="272" font-size="23" fill="#253348">Press first, confirm honestly</text><text x="76" y="321" font-size="21" fill="#536479">100ms pressed-feedback target. Pending</text><text x="76" y="352" font-size="21" fill="#536479">appears immediately; Saved waits for the</text><text x="76" y="383" font-size="21" fill="#536479">server.</text><rect x="614" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="272" font-size="23" fill="#253348">The evidence fold</text><text x="642" y="321" font-size="21" fill="#536479">Open the exact source answer behind a</text><text x="642" y="352" font-size="21" fill="#536479">reflection. A small 180ms opacity transition</text><text x="642" y="383" font-size="21" fill="#536479">supports meaning, not decoration.</text><rect x="48" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="526" font-size="23" fill="#253348">Sparse haptics</text><text x="76" y="575" font-size="21" fill="#536479">Optional selection tick and confirmed-save</text><text x="76" y="606" font-size="21" fill="#536479">feedback. No vibration on scroll and no</text><text x="76" y="637" font-size="21" fill="#536479">error shame.</text><rect x="614" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="526" font-size="23" fill="#253348">Reduced motion everywhere</text><text x="642" y="575" font-size="21" fill="#536479">Remove movement, use a short fade or</text><text x="642" y="606" font-size="21" fill="#536479">immediate state. Back, Close and visible</text><text x="642" y="637" font-size="21" fill="#536479">action menus replace gesture-only paths.</text><text x="48" y="802" font-size="17" fill="#536479">Design specification • Proposals and verification boundaries • Not an app screenshot</text></g></svg>