<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#edf2f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="57" font-size="18" fill="#355db9">NUDGE • PHASE 7</text><text x="48" y="118" font-size="38" fill="#253348">A question before a wall of text</text><text x="48" y="184" font-size="19" fill="#536479">Screen and copy specification · proposals, not rendered app screens</text><rect x="48" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="272" font-size="23" fill="#253348">Today</text><text x="76" y="321" font-size="21" fill="#536479">Question → full answer rows → Skip /</text><text x="76" y="352" font-size="21" fill="#536479">Continue. Change topic is visible. After</text><text x="76" y="383" font-size="21" fill="#536479">saving: Answer another or Finish for now.</text><rect x="614" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="272" font-size="23" fill="#253348">Three real action buttons</text><text x="642" y="321" font-size="21" fill="#536479">Have a decision in mind? · Open your journal</text><text x="642" y="352" font-size="21" fill="#536479">· Question preferences. Full targets and</text><text x="642" y="383" font-size="21" fill="#536479">native pressed states.</text><rect x="48" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="526" font-size="23" fill="#253348">Decide in clear steps</text><text x="76" y="575" font-size="21" fill="#536479">Options → only the missing context → review</text><text x="76" y="606" font-size="21" fill="#536479">→ result with evidence and unknowns.</text><text x="76" y="637" font-size="21" fill="#536479">Unfamiliar terms trigger clarification.</text><rect x="614" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="526" font-size="23" fill="#253348">Every state has a next action</text><text x="642" y="575" font-size="21" fill="#536479">Empty, loading, error, offline and</text><text x="642" y="606" font-size="21" fill="#536479">long-content behavior specified.</text><text x="642" y="637" font-size="21" fill="#536479">Saved-but-refresh-failed never becomes a</text><text x="642" y="668" font-size="21" fill="#536479">duplicate save.</text><text x="48" y="802" font-size="17" fill="#536479">Design specification • Proposals and verification boundaries • Not an app screenshot</text></g></svg>