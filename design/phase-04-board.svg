<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850"><rect width="1200" height="850" fill="#edf2f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="57" font-size="18" fill="#355db9">NUDGE • PHASE 4</text><text x="48" y="118" font-size="38" fill="#253348">Test understanding, not just attraction</text><text x="48" y="184" font-size="19" fill="#536479">Proposed six-participant study · no participant findings claimed</text><rect x="48" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="272" font-size="23" fill="#253348">Three provisional jobs</text><text x="76" y="321" font-size="21" fill="#536479">Try a useful preview. Compare a real choice</text><text x="76" y="352" font-size="21" fill="#536479">without guessing. Correct what Nudge has</text><text x="76" y="383" font-size="21" fill="#536479">learned.</text><rect x="614" y="230" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="272" font-size="23" fill="#253348">Tasks with failure paths</text><text x="642" y="321" font-size="21" fill="#536479">Change topic, explain a reflection's source,</text><text x="642" y="352" font-size="21" fill="#536479">compare unfamiliar terms, recover a lost</text><text x="642" y="383" font-size="21" fill="#536479">connection, find export and deletion.</text><rect x="48" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="76" y="526" font-size="23" fill="#253348">Include access needs</text><text x="76" y="575" font-size="21" fill="#536479">Recruit across Android sizes, large-text use</text><text x="76" y="606" font-size="21" fill="#536479">and assistive technology. Observe task</text><text x="76" y="637" font-size="21" fill="#536479">behavior separately from interpretation.</text><rect x="614" y="484" width="538" height="226" rx="20" fill="#f9fbfd" stroke="#becbda"/><text x="642" y="526" font-size="23" fill="#253348">Measure honest value</text><text x="642" y="575" font-size="21" fill="#536479">Completion, errors, source comprehension,</text><text x="642" y="606" font-size="21" fill="#536479">uncertainty and perceived pressure.</text><text x="642" y="637" font-size="21" fill="#536479">Voluntary Finish is a successful exit.</text><text x="48" y="802" font-size="17" fill="#536479">Design specification • Proposals and verification boundaries • Not an app screenshot</text></g></svg>